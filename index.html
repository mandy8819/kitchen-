<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="apple-touch-icon" href="icon-192.png"><title>Kitchen QC Master</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f3f4f6;color:#20252b;font-family:Arial,Helvetica,sans-serif}
header{background:#20252b;color:white;padding:18px 14px;text-align:center}h1{margin:0;font-size:21px}header p{margin:5px 0 0;color:#cbd0d6;font-size:12px}
main{max-width:700px;margin:auto;padding:12px}.card,.stage{background:#fff;border-radius:13px;margin-bottom:12px;box-shadow:0 1px 4px #0001}.card{padding:14px}
label.title{display:block;font-size:12px;font-weight:bold;color:#555;margin-bottom:5px}
input[type=text],select{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:15px;margin-bottom:11px;background:#fff}
button{border:0;border-radius:9px;padding:12px 14px;font-weight:bold;font-size:14px;cursor:pointer}.primary{background:#17803d;color:#fff}.dark{background:#20252b;color:#fff}.light{background:#eef1f4;color:#20252b}
.topbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}.topbar h2{margin:0;font-size:18px}
.status{font-size:11px;color:#666}.client{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #e2e5e8;border-radius:11px;padding:13px;margin:8px 0;background:#fff;cursor:pointer}
.client strong{display:block;font-size:15px}.client small{display:block;color:#777;margin-top:4px}.pct{font-weight:bold;color:#17803d;white-space:nowrap}
.hidden{display:none!important}.progressbox{background:#fff7ed;color:#9a3412;padding:11px;border-radius:9px;font-size:12px;line-height:1.4;margin-bottom:12px}
.notice{padding:11px;border-radius:9px;background:#eaf4ff;color:#17558a;font-size:12px;line-height:1.45;margin-bottom:12px}
.stage{overflow:hidden;scroll-margin-top:10px}.stage-title{padding:14px;background:#20252b;color:white;font-size:15px;font-weight:bold;display:flex;justify-content:space-between;gap:8px;align-items:center}
.stage-title a{color:#fff;font-size:10px;text-decoration:none;background:#39414a;padding:6px 8px;border-radius:6px}.stage-note{padding:9px 13px;background:#f7f7f7;color:#666;font-size:11px}
.check{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border-top:1px solid #eee;font-size:14px;line-height:1.35;cursor:pointer}
.check input{width:22px;height:22px;margin:0;flex:none;accent-color:#17803d}.check input:checked+span{text-decoration:line-through;color:#777}
.next{display:block;margin:12px;padding:13px;text-align:center;background:#20252b;color:white;text-decoration:none;border-radius:8px;font-weight:bold;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:130px}
</style></head><body>
<header><h1>MODULAR KITCHEN QC</h1><p>Master client list — one app for all kitchens</p></header>
<main id="top">
<section id="home">
<div class="topbar"><div><h2>ALL CLIENTS</h2><div class="status" id="clientCount">0 clients</div></div><button class="primary" onclick="showAdd()">+ ADD CLIENT</button></div>
<div class="notice">One shortcut is enough. Create a client here, then open that client's complete QC checklist whenever you need it.</div>
<div id="clientList"></div>
</section>
<section id="add" class="hidden"><div class="topbar"><button class="light" onclick="showHome()">← BACK</button><h2>NEW CLIENT</h2><span></span></div>
<div class="card"><label class="title">CLIENT NAME</label><input id="newClient" type="text" placeholder="Client name">
<label class="title">SITE ADDRESS</label><input id="newAddress" type="text" placeholder="Site address">
<label class="title">KITCHEN TYPE</label><select id="newType"><option value="">Select kitchen type</option><option>Indian Kitchen</option><option>German Kitchen</option></select>
<button class="primary" style="width:100%" onclick="createClient()">CREATE CLIENT & OPEN CHECKLIST</button></div></section>
<section id="detail" class="hidden"><div class="topbar"><button class="light" onclick="showHome()">← CLIENTS</button><div style="text-align:right"><h2 id="detailName"></h2><div class="status" id="detailProgress"></div></div></div>
<div class="card"><label class="title">CLIENT NAME</label><input id="detailClient" type="text" onchange="saveMeta()">
<label class="title">SITE ADDRESS</label><input id="detailAddress" type="text" onchange="saveMeta">
<label class="title">KITCHEN TYPE</label><select id="detailType" onchange="saveMeta()"><option>Indian Kitchen</option><option>German Kitchen</option></select>
<div class="progressbox" id="progressBox"></div><div class="actions"><button class="dark" onclick="shareApp()">SHARE APP LINK</button><button class="light" onclick="resetClient()">RESET CHECKLIST</button><button class="light" onclick="deleteClient()">DELETE CLIENT</button></div></div>
<div id="checklist"></div></section>
<template id="checkTemplate"><section class="stage" id="stage1"><div class="stage-title"><span>1. SITE MEASUREMENT — FIRST CHECK</span><a href="#top">TOP</a></div><div class="stage-note">Tick every point before moving to the next stage.</div><label class="check"><input type="checkbox" data-key="1-1"><span>Take final wall-to-wall measurement</span></label>

<label class="check"><input type="checkbox" data-key="1-5"><span>Check wall verticality</span></label>
<label class="check"><input type="checkbox" data-key="1-6"><span>Check beams and columns</span></label>
<label class="check"><input type="checkbox" data-key="1-7"><span>Check window and door positions</span></label>
<label class="check"><input type="checkbox" data-key="1-8"><span>Check skirting / tile levels</span></label>
<label class="check"><input type="checkbox" data-key="1-9"><span>Check plumbing points</span></label>
<label class="check"><input type="checkbox" data-key="1-10"><span>Check electrical points</span></label>
<label class="check"><input type="checkbox" data-key="1-11"><span>Check gas point</span></label>
<label class="check"><input type="checkbox" data-key="1-12"><span>Check chimney outlet</span></label>

<section class="stage" id="stage2"><div class="stage-title"><span>2. APPLIANCES & REQUIREMENTS</span><a href="#top">TOP</a></div><div class="stage-note">Tick every point before moving to the next stage.</div><label class="check"><input type="checkbox" data-key="2-1"><span>Confirm refrigerator model and dimensions</span></label>
<label class="check"><input type="checkbox" data-key="2-2"><span>Confirm hob model and dimensions</span></label>
<label class="check"><input type="checkbox" data-key="2-3"><span>Confirm chimney model and dimensions</span></label>
<label class="check"><input type="checkbox" data-key="2-4"><span>Confirm oven model and dimensions</span></label>
<label class="check"><input type="checkbox" data-key="2-5"><span>Confirm microwave model and dimensions</span></label>

<label class="check"><input type="checkbox" data-key="2-10"><span>Confirm appliance door clearances</span></label>

<label class="check"><input type="checkbox" data-key="3-12"><span>Check service cut-outs</span></label>

<label class="check"><input type="checkbox" data-key="4-7"><span>Check dishwasher point</span></label>
<label class="check"><input type="checkbox" data-key="4-8"><span>Check chimney point</span></label>

<label class="check"><input type="checkbox" data-key="4-12"><span>Check RO point</span></label>
<label class="check"><input type="checkbox" data-key="4-13"><span>Check gas point</span></label>

<label class="check"><input type="checkbox" data-key="12-9"><span>Take final photographs</span></label>
<label class="check"><input type="checkbox" data-key="12-10"><span>Complete client final inspection</span></label>
<label class="check"><input type="checkbox" data-key="12-11"><span>Receive client approval</span></label>
<label class="check"><input type="checkbox" data-key="12-12"><span>Hand over warranty / hardware documents</span></label>
<label class="check"><input type="checkbox" data-key="12-13"><span>Mark kitchen COMPLETE</span></label><div class="finish">✓ FINAL CHECK COMPLETE</div></section></template>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyATSeqrOWKFfbQWWRAYFIFoY5DrZI88FKI",
  authDomain: "kitchen-qc.firebaseapp.com",
  projectId: "kitchen-qc",
  storageBucket: "kitchen-qc.firebasestorage.app",
  messagingSenderId: "736549531402",
  appId: "1:736549531402:web:9d7a4669bd3e65e18b14f3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const firestore = getFirestore(app);
let db={clients:[]};
let currentId=null;
let ready=false;
let saveQueue=Promise.resolve();

function show(id){['home','add','detail'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));}
function showHome(){currentId=null;show('home');renderClients();window.scrollTo(0,0);}
function showAdd(){document.getElementById('newClient').value='';document.getElementById('newAddress').value='';document.getElementById('newType').value='';show('add');window.scrollTo(0,0);}
function uid(){return 'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);}
function totalChecks(){const t=document.getElementById('checkTemplate');return t&&t.content?t.content.querySelectorAll('input[type=checkbox]').length:0;}
function progress(c){const done=Object.values(c.checks||{}).filter(Boolean).length;return totalChecks()?Math.round(done/totalChecks()*100):0;}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function showSyncError(msg){
  let n=document.getElementById('syncNotice');
  if(!n){n=document.createElement('div');n.id='syncNotice';n.className='notice';document.getElementById('top').prepend(n);}
  n.textContent=msg;
}
async function saveClient(c){
  if(!ready)return;
  const payload={id:c.id,name:c.name||'',address:c.address||'',type:c.type||'',checks:c.checks||{},createdAt:c.createdAt||Date.now(),updatedAt:Date.now()};
  saveQueue=saveQueue.then(()=>setDoc(doc(firestore,'clients',c.id),payload));
  try{await saveQueue;}catch(e){console.error(e);showSyncError('Could not save this change. Please check your internet connection and Firebase access.');}
}
async function createClient(){
  const name=document.getElementById('newClient').value.trim(),address=document.getElementById('newAddress').value.trim(),type=document.getElementById('newType').value;
  if(!name){alert('Please enter client name.');return}
  const c={id:uid(),name,address,type,checks:{},createdAt:Date.now()};
  db.clients.unshift(c);renderClients();openClient(c.id);await saveClient(c);
}
function renderClients(){
  const el=document.getElementById('clientList');el.innerHTML='';
  document.getElementById('clientCount').textContent=db.clients.length+' client'+(db.clients.length===1?'':'s');
  if(!db.clients.length){el.innerHTML='<div class="card" style="text-align:center;color:#777">No clients yet.<br><br>Tap + ADD CLIENT to create your first kitchen.</div>';return}
  db.clients.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(c=>{
    const d=document.createElement('div');d.className='client';d.onclick=()=>openClient(c.id);
    d.innerHTML='<div><strong>'+esc(c.name)+'</strong><small>'+esc(c.address||'No site address')+' • '+esc(c.type||'Kitchen type not selected')+'</small></div><div class="pct">'+progress(c)+'%</div>';
    el.appendChild(d);
  });
}
function openClient(id){
  currentId=id;const c=db.clients.find(x=>x.id===id);if(!c)return;
  document.getElementById('detailName').textContent=c.name;document.getElementById('detailClient').value=c.name;document.getElementById('detailAddress').value=c.address||'';document.getElementById('detailType').value=c.type||'';
  const box=document.getElementById('checklist');box.innerHTML=document.getElementById('checkTemplate').innerHTML;
  box.querySelectorAll('input[type=checkbox]').forEach(cb=>{cb.checked=!!c.checks[cb.dataset.key];cb.onchange=async()=>{c.checks[cb.dataset.key]=cb.checked;updateDetail();renderClients();await saveClient(c);}});
  show('detail');updateDetail();window.scrollTo(0,0);
}
function updateDetail(){const c=db.clients.find(x=>x.id===currentId);if(!c)return;const p=progress(c);document.getElementById('detailProgress').textContent=p+'% complete';document.getElementById('progressBox').textContent='QC PROGRESS: '+p+'% — '+Object.values(c.checks||{}).filter(Boolean).length+' checks completed';}
async function saveMeta(){const c=db.clients.find(x=>x.id===currentId);if(!c)return;c.name=document.getElementById('detailClient').value.trim()||'Unnamed Client';c.address=document.getElementById('detailAddress').value.trim();c.type=document.getElementById('detailType').value;document.getElementById('detailName').textContent=c.name;updateDetail();renderClients();await saveClient(c);}
async function resetClient(){if(!confirm('Reset every checklist item for this client?'))return;const c=db.clients.find(x=>x.id===currentId);if(!c)return;c.checks={};await saveClient(c);openClient(currentId);}
async function deleteClient(){if(!confirm('Delete this client and its checklist?'))return;const id=currentId;db.clients=db.clients.filter(x=>x.id!==id);showHome();try{await deleteDoc(doc(firestore,'clients',id));}catch(e){console.error(e);showSyncError('Could not delete the client from the shared database.');}}
async function shareApp(){const url=location.href;try{if(navigator.share)await navigator.share({title:'Kitchen QC',text:'Open the Kitchen QC master app',url});else{await navigator.clipboard.writeText(url);alert('App link copied. Send it to your coworkers.');}}catch(e){}}

// Firebase authentication + real-time shared client list
onAuthStateChanged(auth, user=>{
  if(!user)return;
  ready=true;
  onSnapshot(collection(firestore,'clients'), snap=>{
    db.clients=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderClients();
    if(currentId)openClient(currentId);
  }, err=>{console.error(err);showSyncError('Firebase is connected, but access to the shared data was denied. Please check Firebase Authentication and Firestore Rules.');});
});
signInAnonymously(auth).catch(err=>{console.error(err);showSyncError('Firebase sign-in is not enabled yet. Please enable Anonymous sign-in in Firebase Authentication.');});

renderClients();
</script>
<script>if("serviceWorker" in navigator && location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{});</script>
</body></html>
